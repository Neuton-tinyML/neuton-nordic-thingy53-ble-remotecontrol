#
# nRF54L15 TAG specific configuration.
#
# Merged on top of prj.conf

################################################################################
# Console and logging over SEGGER RTT — no pins required.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

################################################################################
# The BMI270 is on spi22 and is already enabled by the board devicetree, so no
# overlay is needed to reach it. Its interrupt line is wired, so the
# data-ready trigger used by bsp_imu works.
