# Thingy:53 (nRF5340) specific configuration. Merged on top of prj.conf.

# RGB LED is on PWM here, so bsp_led uses its PWM backend.
CONFIG_PWM=y

# Console over USB CDC ACM.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n
CONFIG_USB_NRFX_WORK_QUEUE_STACK_SIZE=1200
CONFIG_USB_DEVICE_PRODUCT="Thingy:53 Application"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x530C
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_CONSOLE=y
CONFIG_USB_DEVICE_LOG_LEVEL_ERR=y
CONFIG_USB_DEVICE_LOG_LEVEL_DBG=n

# Flash / storage for the MCUboot DFU flow.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

CONFIG_ADC=y
CONFIG_COUNTER=y
CONFIG_DK_LIBRARY=y
CONFIG_BT_BAS=y
