CONFIG_FPU=y

################################################################################
# Sensors — the BMI270 IMU feeds the gesture model on both boards
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_BMI270_TRIGGER_GLOBAL_THREAD=y

################################################################################
# Bluetooth. The application uses its own GATT service (src/ble/gatt), so no
# HID or other profile is required here.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Neuton NRF RemoteControl"
CONFIG_BT_DEVICE_APPEARANCE=961
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=0
CONFIG_BT_SMP=n
CONFIG_BT_L2CAP_TX_BUF_COUNT=5
CONFIG_BT_LOG_LEVEL_DBG=n
CONFIG_BT_GATT_UUID16_POOL_SIZE=40
CONFIG_BT_GATT_CHRC_POOL_SIZE=20
CONFIG_BT_CONN_CTX=y
CONFIG_BT_SETTINGS=n

CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_MANUF="NordicSemiconductor"
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x1915
CONFIG_BT_DIS_PNP_PID=0xEEEF
CONFIG_BT_DIS_PNP_VER=0x0100

CONFIG_NCS_SAMPLES_DEFAULTS=y

################################################################################
# Logging and console. The console *backend* is board-specific: Thingy:53 uses
# USB CDC ACM, the nRF54L15 TAG has no USB or exposed UART and uses RTT.
CONFIG_STDOUT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_LOG_MODE_MINIMAL=n

CONFIG_SETTINGS=n
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
